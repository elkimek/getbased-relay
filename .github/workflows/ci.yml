name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check, build, and test
        run: npm test

      - name: Verify dist/ output
        # Sanity: tsc should emit at least the entrypoint. Catches a silent
        # `noEmit: true` or missing-file regression that wouldn't fail tsc.
        run: |
          test -f dist/index.js || (echo "dist/index.js missing"; exit 1)
          test -f dist/lib/admin-server.js || (echo "dist/lib/admin-server.js missing"; exit 1)

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build relay image
        run: docker build -t getbased-relay:ci .

      - name: Test the relay production image
        run: |
          docker run --rm --entrypoint sh \
            --mount "type=bind,src=$PWD/test,dst=/app/test,readonly" \
            --mount "type=bind,src=$PWD/context-gateway,dst=/app/context-gateway,readonly" \
            getbased-relay:ci -c 'node --test test/*.test.mjs'

      - name: Build gateway image
        run: docker build -t getbased-context-gateway:ci context-gateway

      - name: Check gateway startup and verified context lifecycle
        run: |
          docker run -d --name context-gateway-ci \
            -e CONTEXT_VERIFIER_SOCKET=/run/getbased-verifier/ci.sock \
            -e CONTEXT_VERIFIER_TOKEN=synthetic-ci-verifier-token \
            --mount "type=bind,src=$PWD/scripts/check-gateway-image.mjs,dst=/tmp/check-gateway-image.mjs,readonly" \
            getbased-context-gateway:ci
          trap 'docker logs context-gateway-ci; docker rm -f context-gateway-ci' EXIT
          docker exec context-gateway-ci node /tmp/check-gateway-image.mjs
