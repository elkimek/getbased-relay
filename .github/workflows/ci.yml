name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check, build, and test
        run: npm test

      - name: Verify dist/ output
        # Sanity: tsc should emit at least the entrypoint. Catches a silent
        # `noEmit: true` or missing-file regression that wouldn't fail tsc.
        run: |
          test -f dist/index.js || (echo "dist/index.js missing"; exit 1)
          test -f dist/lib/admin-server.js || (echo "dist/lib/admin-server.js missing"; exit 1)

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build relay image
        run: docker build -t getbased-relay:ci .

      - name: Test the relay production image
        run: |
          docker run --rm --entrypoint sh \
            --mount "type=bind,src=$PWD/test,dst=/app/test,readonly" \
            --mount "type=bind,src=$PWD/context-gateway,dst=/app/context-gateway,readonly" \
            getbased-relay:ci -c 'node --test test/*.test.mjs'

      - name: Build gateway image
        run: docker build -t getbased-context-gateway:ci context-gateway

      - name: Check gateway startup and request validation
        run: |
          docker run -d --name context-gateway-ci getbased-context-gateway:ci
          trap 'docker rm -f context-gateway-ci' EXIT
          docker exec context-gateway-ci node --input-type=module -e '
            import assert from "node:assert/strict";
            let response;
            for (let attempt = 0; attempt < 50; attempt++) {
              try { response = await fetch("http://127.0.0.1:4001/health"); break; }
              catch { await new Promise(resolve => setTimeout(resolve, 100)); }
            }
            assert.equal(response?.status, 200);
            const invalid = await fetch("http://127.0.0.1:4001/api/context", {
              method: "POST",
              headers: { Authorization: "Bearer synthetic-ci-token", "Content-Type": "application/json" },
              body: "null",
            });
            assert.equal(invalid.status, 400);
          '
